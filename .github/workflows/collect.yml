name: Publicar indicadores Meta 1
on:
  schedule:
    # UTC: 04:15 / 16:15 = 00:15 / 12:15 em Boa Vista (UTC-4).
    - cron: '15 4,16 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meta1-publication
  cancel-in-progress: false
jobs:
  collect:
    # Fail closed if the repository ever becomes private.
    if: github.event.repository.visibility == 'public' && (github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULE == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Testar regras de publicação
        run: node --test tests/*.test.cjs monthly-auto.test.cjs
      - name: Coletar e validar as quatro unidades
        run: node collect.cjs
      - name: Incorporar meses completos e recalcular projeção
        id: monthly
        continue-on-error: true
        timeout-minutes: 2
        run: node collect-monthly.cjs
      - name: Registrar falha da atualização mensal
        if: steps.monthly.outcome == 'failure'
        run: echo "::warning::Projeção mensal preservada por falha de coleta ou validação"
      - name: Publicar somente o JSON validado
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/latest.json data/forecast.json
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar indicadores públicos Meta 1'
            git push origin HEAD:main
          fi
